<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Q&A | KentaiMIA</title>
  
  <meta name="theme-color" content="#f68b1e">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KentaiMIA">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192?text=KentaiMIA">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script>
    function goBackToListings() {
      window.location.href = 'my-listings.html';
    }
  </script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap");
    body { font-family: "Inter", sans-serif; background-color: #f8fafc; color: #1e293b; padding-bottom: 70px; }
    @media (min-width: 768px) { body { padding-bottom: 0; } }
    .jumia-orange { background-color: #f68b1e; }
    .jumia-text-orange { color: #f68b1e; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    .reply-modal {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .reply-modal.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button onclick="goBackToListings()" class="p-2 text-slate-600 hover:text-orange-600 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <div class="flex items-center gap-2 cursor-pointer flex-shrink-0" onclick="location.href='index.html'">
          <div class="w-10 h-10 jumia-orange rounded-lg flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
          </div>
          <span class="font-black text-slate-900 text-xl tracking-tighter hidden md:inline uppercase">KentaiMIA</span>
        </div>
      </div>

      <div class="flex-1 max-w-xl relative hidden md:block">
        <input type="text" id="searchInput" placeholder="Search questions..." class="w-full pl-10 pr-4 py-2 rounded-md border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-400 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 absolute left-3 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <div class="flex items-center gap-1 sm:gap-2 bg-orange-50 px-2 sm:px-3 py-1.5 rounded-full border border-orange-200">
          <svg class="w-4 h-4 text-orange-500" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
          <span class="text-orange-600 font-black text-xs sm:text-sm" id="navPoints">0</span>
        </div>
        <button onclick="location.href='my-listings.html'" class="hidden sm:flex items-center gap-2 text-slate-600 hover:text-orange-600 font-black uppercase text-[10px] tracking-widest transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            My List
        </button>
        <button onclick="location.href='promote.html'" class="jumia-orange text-white px-3 sm:px-5 py-2 rounded-md font-bold text-xs sm:text-sm hover:opacity-90 transition uppercase tracking-wide">Sell</button>
        <div class="hidden lg:flex flex-col items-end border-r border-slate-200 pr-4 mr-2">
          <span id="userEmailDisplay" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Loading...</span>
          <span class="text-[9px] font-black text-orange-500 uppercase tracking-tighter">Verified Seller</span>
        </div>
        <button onclick="handleLogout()" class="p-2 text-slate-500 hover:text-red-600 transition"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg></button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 sm:py-12">
    <div class="mb-10 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
      <div>
        <div class="flex items-center gap-3 mb-2">
          <h1 class="text-3xl font-extrabold text-slate-900">Buyer Questions</h1>
          <span id="qaUnreadBadge" class="px-3 py-1 bg-red-500 text-white text-sm font-bold rounded-full">0</span>
        </div>
        <p class="text-slate-500">Manage inquiries about your items and build trust with buyers.</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="readAllBtn" onclick="readAllMessages(event)" class="px-4 py-2 bg-blue-500 text-white text-xs font-bold rounded-lg hover:bg-blue-600 transition uppercase tracking-wide">Read All</button>
        <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">Live Updates</span>
        </div>
      </div>
    </div>

    <div id="questionsContainer" class="space-y-6">
      <div class="flex flex-col items-center justify-center py-20 text-center bg-white rounded-3xl border border-slate-100 shadow-sm">
        <div class="w-16 h-16 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-slate-500 font-medium">Loading your questions...</p>
      </div>
    </div>
  </main>

  <!-- Reply Modal -->
  <div id="replyModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-all duration-300">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300">
      <div class="p-6 sm:p-8">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-2xl font-bold text-slate-900">Send Reply</h3>
          <button onclick="closeReplyModal()" class="text-slate-400 hover:text-slate-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="modalQuestionContext" class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Question from Buyer</p>
          <p id="modalQuestionText" class="text-slate-700 italic"></p>
        </div>
        <form id="replyForm" onsubmit="handleReplySubmit(event)">
          <input type="hidden" id="replyQuestionId">
          <input type="hidden" id="replyItemId">
          <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Your Answer</label>
            <textarea id="replyText" required rows="4" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-4 focus:ring-orange-500/10 focus:border-orange-500 transition resize-none" placeholder="Type your response here..."></textarea>
          </div>
          <div class="flex gap-3">
            <button type="button" onclick="closeReplyModal()" class="flex-1 px-6 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Cancel</button>
            <button type="submit" class="flex-[2] px-6 py-3 rounded-xl font-bold text-white jumia-orange hover:opacity-90 transition shadow-lg shadow-orange-500/30">Send Answer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit Message Modal -->
  <div id="editModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-all duration-300">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300">
      <div class="p-6 sm:p-8">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-2xl font-bold text-slate-900">Edit Message</h3>
          <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="editForm" onsubmit="handleEditSubmit(event)">
          <input type="hidden" id="editMessageId">
          <input type="hidden" id="editItemId">
          <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Message</label>
            <textarea id="editText" required rows="4" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-4 focus:ring-orange-500/10 focus:border-orange-500 transition resize-none"></textarea>
          </div>
          <div class="flex gap-3">
            <button type="button" onclick="closeEditModal()" class="flex-1 px-6 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Cancel</button>
            <button type="submit" class="flex-[2] px-6 py-3 rounded-xl font-bold text-white jumia-orange hover:opacity-90 transition shadow-lg shadow-orange-500/30">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 h-16 flex items-center justify-around px-4 z-50">
    <button onclick="location.href='index.html'" class="flex flex-col items-center gap-1 text-slate-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
      <span class="text-[8px] font-black uppercase">Home</span>
    </button>
    <button onclick="location.href='my-listings.html'" class="flex flex-col items-center gap-1 text-slate-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
      <span class="text-[8px] font-black uppercase">My List</span>
    </button>
    <button onclick="location.href='promote.html'" class="flex flex-col items-center gap-1 text-slate-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
      <span class="text-[8px] font-black uppercase">Sell</span>
    </button>
  </nav>

  <script>
    let currentUser = null;

    window.addEventListener("load", () => {
      if (window.firebaseApp && window.firebaseApp.auth) {
        window.firebaseApp.auth.onAuthStateChanged(async user => {
          if (user) {
            currentUser = user;
            const doc = await window.firebaseApp.db.collection("users").doc(user.uid).get();
            const points = (doc.data() && doc.data().points) || 0;
            const navPoints = document.getElementById("navPoints");
            if (navPoints) navPoints.textContent = points;
            
            const emailDisplay = document.getElementById("userEmailDisplay");
            if (emailDisplay) emailDisplay.textContent = user.email;
            
            loadAllQuestions();
          } else {
            window.location.href = "auth.html";
          }
        });
      }
    });

    function handleLogout() { 
      if (window.firebaseApp && window.firebaseApp.auth) {
        window.firebaseApp.auth.signOut().then(() => window.location.href = "auth.html"); 
      }
    }

    function updateQABadge(totalUnread) {
      const badge = document.getElementById('qaUnreadBadge');
      if (badge) {
        badge.textContent = totalUnread;
        badge.style.display = totalUnread > 0 ? 'inline-block' : 'none';
      }
      // Sync unread count to sessionStorage for cross-page sync with my-listings.html
      if (window.firebaseApp && window.firebaseApp.auth && window.firebaseApp.auth.currentUser) {
        sessionStorage.setItem('unreadMessageCount', totalUnread);
      }
    }

    function formatRelativeTime(timestamp) {
      if (!timestamp) return 'Unknown time';
      const messageTime = timestamp.toMillis ? timestamp.toMillis() : timestamp;
      const now = Date.now();
      const diff = now - messageTime;
      
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      
      if (seconds < 60) return 'just now';
      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;
      
      const date = new Date(messageTime);
      return date.toLocaleDateString();
    }

    async function loadAllQuestions() {
      const user = currentUser || window.firebaseApp.auth.currentUser;
      if (!user) return;
      
      const container = document.getElementById('questionsContainer');
      
      try {
        const itemsSnapshot = await window.firebaseApp.db.collection('listings').where('ownerId', '==', user.uid).get();
        if (itemsSnapshot.empty) {
          container.innerHTML = `<div class="bg-white p-20 rounded-3xl text-center border border-slate-100 shadow-sm"><p class="text-slate-400 font-bold uppercase text-xs tracking-widest">No products found.</p></div>`;
          updateQABadge(0);
          return;
        }

        let allItemData = [];
        for (const doc of itemsSnapshot.docs) {
          const messagesSnapshot = await window.firebaseApp.db.collection('listings').doc(doc.id).collection('messages').orderBy('timestamp', 'desc').get();
          if (!messagesSnapshot.empty) {
            const messages = messagesSnapshot.docs.map(m => ({ id: m.id, ...m.data() }));
            messages.sort((a, b) => (b.timestamp?.toMillis?.() || b.timestamp || 0) - (a.timestamp?.toMillis?.() || a.timestamp || 0));
            
            allItemData.push({
              item: { id: doc.id, ...doc.data() },
              messages: messages
            });
          }
        }

        allItemData.sort((a, b) => {
          const timeA = a.messages[0].timestamp?.toMillis ? a.messages[0].timestamp.toMillis() : (a.messages[0].timestamp || 0);
          const timeB = b.messages[0].timestamp?.toMillis ? b.messages[0].timestamp.toMillis() : (b.messages[0].timestamp || 0);
          return timeB - timeA;
        });

        // Calculate total unread messages
        let totalUnread = 0;
        allItemData.forEach(data => {
          totalUnread += data.messages.filter(m => !m.isRead).length;
        });
        updateQABadge(totalUnread);

        if (allItemData.length === 0) {
          container.innerHTML = `<div class="bg-white p-20 rounded-3xl text-center border border-slate-100 shadow-sm"><p class="text-slate-400 font-bold uppercase text-xs tracking-widest">No messages yet.</p></div>`;
          return;
        }

        container.innerHTML = allItemData.map(data => {
          const unreadCount = data.messages.filter(m => !m.isRead).length;
          
          return `
          <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden mb-6">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl shadow-sm border border-slate-200 flex items-center justify-center overflow-hidden relative">
                  <img src="${data.item.images ? data.item.images[0] : 'https://via.placeholder.com/100'}" class="w-full h-full object-cover">
                  ${unreadCount > 0 ? `<div class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">${unreadCount}</div>` : ''}
                </div>
                <div>
                  <h3 class="font-bold text-slate-900 leading-tight">${data.item.title}</h3>
                  <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${data.messages.length} MESSAGES ${unreadCount > 0 ? `<span class="text-red-500">(${unreadCount} unread)</span>` : ''}</p>
                </div>
              </div>
            </div>
            <div class="divide-y divide-slate-50">
              ${(() => {
                const questions = data.messages.filter(m => !m.replyToId);
                const replies = data.messages.filter(m => m.replyToId);

                let groupedHtml = '';
                questions.forEach(q => {
                  const isUnread = !q.isRead && q.senderId !== data.item.ownerId;
                  const isAuthor = q.senderId === currentUser.uid;
                  
                  groupedHtml += `
                    <div class="p-6 ${isUnread ? 'bg-orange-50/30 border-l-4 border-orange-400' : ''}">
                      <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                          <div class="w-8 h-8 ${q.senderId === data.item.ownerId ? 'bg-orange-500 text-white' : 'bg-orange-100 text-orange-600'} rounded-full flex items-center justify-center font-bold text-xs relative">
                            ${(q.senderName || q.senderEmail || 'U').charAt(0).toUpperCase()}
                            ${isUnread ? `<div class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border border-white"></div>` : ''}
                          </div>
                          <div>
                            <p class="text-sm font-bold text-slate-900">${q.senderName || 'User'}</p>
                            <p class="text-[9px] font-medium text-slate-400">${q.senderEmail || 'No email provided'}</p>
                            <p class="text-[10px] text-slate-400 font-medium">${formatRelativeTime(q.timestamp)}</p>
                          </div>
                        </div>
                        <div class="flex items-center gap-2">
                          ${isUnread ? `<span class="px-2 py-1 bg-red-100 text-red-600 text-[10px] font-bold rounded-full uppercase tracking-tighter">Unread</span>` : ''}
                          ${q.senderId === data.item.ownerId ? `<span class="px-2 py-1 bg-green-100 text-green-600 text-[10px] font-bold rounded-full uppercase tracking-tighter">Your Reply</span>` : `<span class="px-2 py-1 bg-orange-100 text-orange-600 text-[10px] font-bold rounded-full uppercase tracking-tighter">Question</span>`}
                        </div>
                      </div>
                      <div class="bg-slate-50 rounded-2xl p-4 mb-3 border border-slate-100">
                        <p class="text-slate-700 text-sm leading-relaxed">${q.text}</p>
                      </div>
                      <div class="flex items-center gap-3 flex-wrap">
                        ${q.senderId !== data.item.ownerId ? `<button onclick="openReplyModal('${q.id}', '${q.text.replace(/'/g, "\\'")}', '${data.item.id}')" class="text-xs font-bold text-orange-500 hover:text-orange-600 transition">Reply</button>` : ''}
                        ${isUnread ? `<button onclick="markMessageAsRead('${data.item.id}', '${q.id}')" class="text-xs font-bold text-blue-500 hover:text-blue-600 transition">Mark as Read</button>` : `<button onclick="markMessageAsUnread('${data.item.id}', '${q.id}')" class="text-xs font-bold text-gray-500 hover:text-gray-600 transition">Mark as Unread</button>`}
                        ${isAuthor ? `<button onclick="openEditModal('${q.id}', '${q.text.replace(/'/g, "\\'")}', '${data.item.id}')" class="text-xs font-bold text-purple-500 hover:text-purple-600 transition">Edit</button>` : ''}
                        ${isAuthor ? `<button onclick="deleteMessage('${data.item.id}', '${q.id}')" class="text-xs font-bold text-red-500 hover:text-red-600 transition">Delete</button>` : ''}
                      </div>
                    </div>
                  `;

                  replies.filter(r => r.replyToId === q.id).forEach(r => {
                    const replyIsUnread = !r.isRead && r.senderId !== data.item.ownerId;
                    const isReplyAuthor = r.senderId === currentUser.uid;
                    
                    groupedHtml += `
                      <div class="p-6 pl-12 border-l-4 border-orange-100 ml-6 ${replyIsUnread ? 'bg-orange-50/30' : ''}">
                        <div class="flex justify-between items-start mb-4">
                          <div class="flex items-center gap-3">
                            <div class="w-8 h-8 ${r.senderId === data.item.ownerId ? 'bg-orange-500 text-white' : 'bg-orange-100 text-orange-600'} rounded-full flex items-center justify-center font-bold text-xs relative">
                              ${(r.senderName || r.senderEmail || 'U').charAt(0).toUpperCase()}
                              ${replyIsUnread ? `<div class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border border-white"></div>` : ''}
                            </div>
                            <div>
                              <p class="text-sm font-bold text-slate-900">${r.senderName || 'User'}</p>
                              <p class="text-[9px] font-medium text-slate-400">${r.senderEmail || 'No email provided'}</p>
                              <p class="text-[10px] text-slate-400 font-medium">${formatRelativeTime(r.timestamp)}</p>
                            </div>
                          </div>
                          <div class="flex items-center gap-2">
                            ${r.senderId === data.item.ownerId ? `<span class="px-2 py-1 bg-green-100 text-green-600 text-[10px] font-bold rounded-full uppercase tracking-tighter">Your Reply</span>` : `<span class="px-2 py-1 bg-orange-100 text-orange-600 text-[10px] font-bold rounded-full uppercase tracking-tighter">Question</span>`}
                          </div>
                        </div>
                        <div class="bg-slate-50 rounded-2xl p-4 mb-3 border border-slate-100">
                          <div class="bg-white/50 p-2 rounded-lg mb-2 border-l-4 border-orange-200 italic text-[10px] text-slate-400">Replying to: ${r.replyToText.substring(0, 100)}${r.replyToText.length > 100 ? '...' : ''}</div>
                          <p class="text-slate-700 text-sm leading-relaxed">${r.text}</p>
                        </div>
                        <div class="flex items-center gap-3 flex-wrap">
                          ${isReplyAuthor ? `<button onclick="openEditModal('${r.id}', '${r.text.replace(/'/g, "\\'")}', '${data.item.id}')" class="text-xs font-bold text-purple-500 hover:text-purple-600 transition">Edit</button>` : ''}
                          ${isReplyAuthor ? `<button onclick="deleteMessage('${data.item.id}', '${r.id}')" class="text-xs font-bold text-red-500 hover:text-red-600 transition">Delete</button>` : ''}
                        </div>
                      </div>
                    `;
                  });
                });
                return groupedHtml;
              })()}
            </div>
          </div>
        `;
        }).join('');
      } catch (e) {
        container.innerHTML = `<div class="p-10 text-center text-red-500">Error: ${e.message}</div>`;
        updateQABadge(0);
      }
    }

    function openReplyModal(msgId, msgText, itemId) {
      document.getElementById('replyQuestionId').value = msgId;
      document.getElementById('replyItemId').value = itemId;
      document.getElementById('modalQuestionText').textContent = `"${msgText}"`;
      const modal = document.getElementById('replyModal');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
      }, 10);
    }

    function closeReplyModal() {
      const modal = document.getElementById('replyModal');
      modal.classList.add('opacity-0');
      modal.querySelector('div').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
      document.getElementById('replyForm').reset();
    }

    function openEditModal(msgId, msgText, itemId) {
      document.getElementById('editMessageId').value = msgId;
      document.getElementById('editItemId').value = itemId;
      document.getElementById('editText').value = msgText;
      const modal = document.getElementById('editModal');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
      }, 10);
    }

    function closeEditModal() {
      const modal = document.getElementById('editModal');
      modal.classList.add('opacity-0');
      modal.querySelector('div').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
      document.getElementById('editForm').reset();
    }

    async function markMessageAsRead(itemId, messageId) {
      try {
        await window.firebaseApp.db.collection('listings').doc(itemId).collection('messages').doc(messageId).update({
          isRead: true
        });
        loadAllQuestions();
      } catch (error) {
        console.error('Error marking message as read:', error);
        alert('Error: ' + error.message);
      }
    }

    async function markMessageAsUnread(itemId, messageId) {
      try {
        await window.firebaseApp.db.collection('listings').doc(itemId).collection('messages').doc(messageId).update({
          isRead: false
        });
        loadAllQuestions();
      } catch (error) {
        console.error('Error marking message as unread:', error);
        alert('Error: ' + error.message);
      }
    }

    async function readAllMessages(event) {
      const user = currentUser || window.firebaseApp.auth.currentUser;
      if (!user) return;

      const btn = event.target;
      const originalText = btn.textContent;
      btn.textContent = 'Processing...';
      btn.disabled = true;

      try {
        const itemsSnapshot = await window.firebaseApp.db.collection('listings').where('ownerId', '==', user.uid).get();
        
        let updateCount = 0;
        const batch = window.firebaseApp.db.batch();
        
        for (const doc of itemsSnapshot.docs) {
          const messagesSnapshot = await window.firebaseApp.db.collection('listings').doc(doc.id).collection('messages').get();
          
          for (const msgDoc of messagesSnapshot.docs) {
            const messageRef = window.firebaseApp.db.collection('listings').doc(doc.id).collection('messages').doc(msgDoc.id);
            batch.update(messageRef, { isRead: true });
            updateCount++;
          }
        }
        
        if (updateCount > 0) {
          await batch.commit();
          alert(`Marked ${updateCount} message(s) as read`);
          loadAllQuestions();
        } else {
          alert('No messages found');
        }
        
        btn.textContent = originalText;
        btn.disabled = false;
      } catch (error) {
        console.error('Error reading all messages:', error);
        alert('Error: ' + error.message);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    async function handleEditSubmit(event) {
      event.preventDefault();
      const msgId = document.getElementById('editMessageId').value;
      const itemId = document.getElementById('editItemId').value;
      const editText = document.getElementById('editText').value;
      
      if (!editText.trim()) {
        alert('Message cannot be empty');
        return;
      }

      try {
        await window.firebaseApp.db.collection('listings').doc(itemId).collection('messages').doc(msgId).update({
          text: editText
        });
        closeEditModal();
        loadAllQuestions();
      } catch (error) {
        console.error('Error editing message:', error);
        alert('Error: ' + error.message);
      }
    }

    async function deleteMessage(itemId, messageId) {
      if (!confirm('Are you sure you want to delete this message?')) return;

      try {
        await window.firebaseApp.db.collection('listings').doc(itemId).collection('messages').doc(messageId).delete();
        loadAllQuestions();
      } catch (error) {
        console.error('Error deleting message:', error);
        alert('Error: ' + error.message);
      }
    }

    async function handleReplySubmit(event) {
      event.preventDefault();
      const msgId = document.getElementById('replyQuestionId').value;
      const itemId = document.getElementById('replyItemId').value;
      const replyText = document.getElementById('replyText').value;
      
      if (!itemId) { alert("Error: Product ID missing"); return; }

      try {
        await window.firebaseApp.db.collection('listings').doc(itemId).collection('messages').add({
          text: replyText,
          senderId: currentUser.uid,
          senderEmail: currentUser.email,
          senderName: currentUser.displayName || 'Seller',
          timestamp: firebase.firestore.Timestamp.now(),
          replyToId: msgId,
          replyToText: document.getElementById('modalQuestionText').textContent.replace(/"/g, ''),
          isRead: true
        });
        closeReplyModal();
        loadAllQuestions();
      } catch (error) {
        alert("Error: " + error.message);
      }
    }
  </script>
</body>
