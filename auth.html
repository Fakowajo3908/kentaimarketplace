<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Kentai Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    .auth-gradient { background: radial-gradient(circle at top right, #f68b1e, #fb923c, #fed7aa); }
    .password-toggle { cursor: pointer; }
  </style>
</head>
<body class="auth-gradient min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <!-- Logo/Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-xl mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-orange-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Kentai Marketplace</h1>
      <p class="text-orange-100 font-medium mt-2">Universal Hobby Trading Made Easy By Fako ( Arshad Jr ) </p>
    </div>

    <!-- Auth Card -->
    <div class="glass rounded-3xl shadow-2xl overflow-hidden border border-white/20">
      <!-- Tabs -->
      <div class="flex border-b border-slate-100">
        <button onclick="switchTab('login')" id="loginTab" class="flex-1 py-4 text-sm font-bold transition-all border-b-2 border-orange-600 text-orange-600 bg-white">LOGIN</button>
        <button onclick="switchTab('signup')" id="signupTab" class="flex-1 py-4 text-sm font-bold transition-all border-b-2 border-transparent text-slate-400 hover:text-slate-600">SIGN UP</button>
      </div>

      <div class="p-8">
        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" /></svg>
              </span>
              <input type="email" id="loginEmail" placeholder="name@company.com" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-600 focus:bg-white outline-none transition" required>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              </span>
              <input type="password" id="loginPassword" placeholder="••••••••" class="w-full pl-11 pr-12 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-600 focus:bg-white outline-none transition" required>
              <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-orange-600 password-toggle" onclick="togglePassword('loginPassword')">
                <svg id="loginPasswordIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="w-full bg-orange-600 text-white font-bold py-4 rounded-xl hover:bg-orange-700 transition shadow-lg shadow-orange-200 active:scale-[0.98]">Sign In</button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="hidden space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Full Name</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              </span>
              <input type="text" id="signupName" placeholder="John Doe" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-600 focus:bg-white outline-none transition" required>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
            <input type="email" id="signupEmail" placeholder="name@company.com" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-600 focus:bg-white outline-none transition" required>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
            <div class="relative">
              <input type="password" id="signupPassword" placeholder="6+ characters" class="w-full px-4 pr-12 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-600 focus:bg-white outline-none transition" required>
              <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-orange-600 password-toggle" onclick="togglePassword('signupPassword')">
                <svg id="signupPasswordIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>
          
          <div class="flex items-start gap-3 py-2">
            <input type="checkbox" id="termsCheckbox" class="mt-1 w-4 h-4 text-orange-600 border-slate-300 rounded focus:ring-orange-500 cursor-pointer" required>
            <label for="termsCheckbox" class="text-xs text-slate-500 leading-tight cursor-pointer">
              I agree to the <a href="#" class="text-orange-600 font-bold hover:underline">Terms of Service</a> and <a href="#" class="text-orange-600 font-bold hover:underline">Privacy Policy</a>.
            </label>
          </div>

          <button type="submit" class="w-full bg-orange-600 text-white font-bold py-4 rounded-xl hover:bg-orange-700 transition shadow-lg shadow-orange-200 active:scale-[0.98]">Create Account</button>
        </form>

        <div id="authMessage" class="mt-6 text-center text-sm font-medium hidden"></div>
      </div>
    </div>
    
    <p class="text-center mt-8 text-orange-100 text-sm font-medium">By continuing, you agree to our <a href="terms.html" class="text-orange-600 font-bold hover:underline">Terms of Service</a> and <a href="privacy.html" class="text-orange-600 font-bold hover:underline">Privacy Policy</a>.</p>
  </div>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const loginTab = document.getElementById('loginTab');
      const signupTab = document.getElementById('signupTab');
      const msg = document.getElementById('authMessage');

      msg.classList.add('hidden');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        loginTab.className = "flex-1 py-4 text-sm font-bold transition-all border-b-2 border-orange-600 text-orange-600 bg-white";
        signupTab.className = "flex-1 py-4 text-sm font-bold transition-all border-b-2 border-transparent text-slate-400 hover:text-slate-600";
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        signupTab.className = "flex-1 py-4 text-sm font-bold transition-all border-b-2 border-orange-600 text-orange-600 bg-white";
        loginTab.className = "flex-1 py-4 text-sm font-bold transition-all border-b-2 border-transparent text-slate-400 hover:text-slate-600";
      }
    }

    function showMsg(text, isError) {
      const msg = document.getElementById('authMessage');
      msg.textContent = text;
      msg.className = `mt-6 text-center text-sm font-bold ${isError ? 'text-red-500' : 'text-green-600'}`;
      msg.classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await loginUser(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
        showMsg('Login successful! Redirecting...', false);
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) { showMsg(err.message, true); }
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const termsAccepted = document.getElementById('termsCheckbox').checked;
      
      if (!termsAccepted) {
        showMsg('Please agree to the Terms of Service to continue.', true);
        return;
      }

      try {
        await signUpUser(document.getElementById('signupEmail').value, document.getElementById('signupPassword').value, document.getElementById('signupName').value);
        showMsg('Account created! Redirecting...', false);
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) { showMsg(err.message, true); }
    });
  </script>
</body>
</html>
