<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Store - Kentai Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <link rel="manifest" href="manifest.json">
    <script src="firebase-config.js"></script>
    <script src="utils.js"></script>
    <script src="store-setup.js"></script>
    <style>
        /* Custom styles for better mobile experience */
        .suggestion-btn {
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="goBack()" class="flex items-center gap-1 text-slate-600 hover:text-orange-600 font-bold transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span class="hidden sm:inline">Back</span>
            </button>
            
            <a href="index.html" class="text-lg sm:text-2xl font-black text-orange-600 truncate px-2">Kentai Marketplace</a>
            
            <button onclick="handleLogout()" class="px-3 py-1.5 sm:px-6 sm:py-2 bg-slate-100 text-slate-600 font-bold rounded-lg hover:bg-slate-200 transition text-sm sm:text-base">
                Logout
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-2xl mx-auto px-4 py-6 sm:py-12">
        <div class="text-center mb-8 sm:mb-12">
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-2">Create Your Store</h1>
            <p class="text-slate-600 text-sm sm:text-base px-4">Set up your branded storefront and start selling today</p>
        </div>

        <div class="bg-white rounded-2xl sm:rounded-3xl shadow-lg p-5 sm:p-8 border border-slate-100">
            <form id="storeSetupForm" onsubmit="handleStoreSetup(event)">
                
                <!-- Profile Customization -->
                <div class="mb-8 flex flex-col items-center gap-4">
                    <div id="profilePreview" class="w-24 h-24 sm:w-32 sm:h-32 bg-gradient-to-br from-orange-400 to-orange-600 rounded-2xl flex items-center justify-center text-white text-4xl sm:text-5xl font-black shadow-lg overflow-hidden">
                        <span id="initialDisplay">S</span>
                    </div>
                    <div class="flex flex-col gap-2 w-full">
                        <label class="block text-sm font-bold text-slate-900">Store Profile Picture (Optional)</label>
                        <input type="file" id="profileImage" accept="image/*" onchange="handleProfileImageSelect(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-black file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100 transition">
                        <p class="text-[10px] text-slate-400">Or customize the alphabet below</p>
                        <input type="text" id="storeInitial" maxlength="2" placeholder="S" oninput="updateInitial(this.value)" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-bold text-sm">
                    </div>
                </div>

                <!-- Store Name -->
                <div class="mb-5 sm:mb-6">
                    <label class="block text-sm font-bold text-slate-900 mb-2">Store Name *</label>
                    <input type="text" id="storeName" placeholder="My Amazing Store" 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium text-base" required>
                </div>

                <!-- Store Slug (URL) -->
                <div class="mb-5 sm:mb-6">
                    <label class="block text-sm font-bold text-slate-900 mb-2">Store URL Slug *</label>
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                        <span class="text-xs sm:text-sm text-slate-500 font-medium break-all">store.html?storeSlug=</span>
                        <input type="text" id="storeSlug" placeholder="my-store" 
                            class="w-full sm:flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium text-base" required>
                    </div>
                </div>

                <!-- Store Description -->
                <div class="mb-5 sm:mb-6">
                    <label class="block text-sm font-bold text-slate-900 mb-2">Store Description</label>
                    
                    <!-- Scrollable Suggestions for Mobile -->
                    <div class="mb-3 flex overflow-x-auto gap-2 pb-2 hide-scrollbar">
                        <button type="button" onclick="suggestDescription('We offer premium quality products with excellent customer service and fast shipping.')" class="suggestion-btn text-[10px] sm:text-xs px-3 py-1.5 bg-orange-100 text-orange-600 rounded-full hover:bg-orange-200 transition font-bold flex-shrink-0">Premium Quality</button>
                        <button type="button" onclick="suggestDescription('Your one-stop shop for all your needs. Handpicked items at competitive prices.')" class="suggestion-btn text-[10px] sm:text-xs px-3 py-1.5 bg-orange-100 text-orange-600 rounded-full hover:bg-orange-200 transition font-bold flex-shrink-0">One-Stop Shop</button>
                        <button type="button" onclick="suggestDescription('Authentic products sourced directly. We guarantee quality and reliability.')" class="suggestion-btn text-[10px] sm:text-xs px-3 py-1.5 bg-orange-100 text-orange-600 rounded-full hover:bg-orange-200 transition font-bold flex-shrink-0">Authentic Only</button>
                        <button type="button" onclick="suggestDescription('Trusted seller with 5-star ratings. Same-day processing and secure payments.')" class="suggestion-btn text-[10px] sm:text-xs px-3 py-1.5 bg-orange-100 text-orange-600 rounded-full hover:bg-orange-200 transition font-bold flex-shrink-0">Top Rated</button>
                        <button type="button" onclick="suggestDescription('Exclusive deals and limited-time offers. Subscribe to our newsletter for updates.')" class="suggestion-btn text-[10px] sm:text-xs px-3 py-1.5 bg-orange-100 text-orange-600 rounded-full hover:bg-orange-200 transition font-bold flex-shrink-0">Exclusive Deals</button>
                    </div>
                    
                    <textarea id="storeDescription" placeholder="Tell customers about your store..." rows="4"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium resize-none text-base"></textarea>
                </div>

                <!-- Store Category -->
                <div class="mb-5 sm:mb-6">
                    <label class="block text-sm font-bold text-slate-900 mb-2">Primary Category</label>
                    <select id="storeCategory" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium text-base">
                        <option value="">Select a category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion & Clothing</option>
                        <option value="Home">Home & Garden</option>
                        <option value="Sports">Sports & Outdoors</option>
                        <option value="Books">Books & Media</option>
                        <option value="Toys">Toys & Games</option>
                        <option value="Beauty">Beauty & Personal Care</option>
                        <option value="Food">Food & Beverages</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="storeCategoryCustom" placeholder="Or enter your own category..." 
                        class="w-full px-4 py-3 mt-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium text-base">
                </div>

                <!-- Store Contact -->
                <div class="mb-5 sm:mb-6">
                    <label class="block text-sm font-bold text-slate-900 mb-2">Store Contact Email</label>
                    <input type="email" id="storeEmail" placeholder="store@example.com"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium text-base">
                </div>

                <!-- Store Phone -->
                <div class="mb-5 sm:mb-6">
                    <label class="block text-sm font-bold text-slate-900 mb-2">Store Contact Phone</label>
                    <div class="flex gap-2">
                        <select id="storePhoneCountry" class="max-w-[100px] sm:max-w-none px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-medium text-base">
                            <option value="+234">🇳🇬 +234</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+27">🇿🇦 +27</option>
                            <option value="+233">🇬🇭 +233</option>
                            <option value="+254">🇰🇪 +254</option>
                            <option value="+255">🇹🇿 +255</option>
                            <option value="+256">🇺🇬 +256</option>
                            <option value="+20">🇪🇬 +20</option>
                            <option value="+212">🇲🇦 +212</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+86">🇨🇳 +86</option>
                            <option value="+1">🇨🇦 +1</option>
                            <option value="+61">🇦🇺 +61</option>
                            <option value="+49">🇩🇪 +49</option>
                            <option value="+33">🇫🇷 +33</option>
                            <option value="+34">🇪🇸 +34</option>
                            <option value="+39">🇮🇹 +39</option>
                        </select>
                        <input type="tel" id="storePhone" placeholder="000-000-0000"
                            class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium text-base">
                    </div>
                </div>

                <!-- Store Address -->
                <div class="mb-5 sm:mb-6">
                    <label class="block text-sm font-bold text-slate-900 mb-2">Store Address</label>
                    <input type="text" id="storeAddress" placeholder="123 Main St, City, Country"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium text-base">
                </div>

                <!-- Social Links -->
                <div class="mb-8">
                    <label class="block text-sm font-bold text-slate-900 mb-2">Social Media Links (Optional)</label>
                    <div id="socialLinksContainer" class="space-y-3"></div>
                    <button type="button" onclick="addSocialLink()" class="mt-3 w-full sm:w-auto py-2 px-4 border-2 border-dashed border-slate-200 text-sm font-bold text-slate-500 rounded-xl hover:border-orange-500 hover:text-orange-600 transition">
                        + Add Social Link
                    </button>
                </div>

                <!-- Terms -->
                <div class="mb-8 p-4 bg-orange-50 rounded-xl border border-orange-200">
                    <label class="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" id="agreeTerms" class="mt-1 w-5 h-5 rounded border-slate-300 text-orange-600 focus:ring-orange-500" required>
                        <span class="text-sm text-slate-700 leading-tight">I agree to the store terms and conditions</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-orange-500 to-orange-600 text-white font-black text-lg rounded-2xl hover:shadow-lg active:scale-[0.98] transition">
                    Create My Store
                </button>
            </form>
        </div>
    </div>

    <script>
        function suggestDescription(text) {
            document.getElementById('storeDescription').value = text;
        }
        
        function goBack() {
            window.history.back();
        }
    </script>
</body>
    <script src="chat-widget.js"></script>
</html>
