<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - Kentai Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <link rel="manifest" href="manifest.json">
    <script src="firebase-config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            
            
            <div class="flex items-center gap-2">
                <button onclick="goBack()" class="p-2 text-slate-600 hover:text-orange-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                
                <!-- Owner Only Actions -->
                <div id="ownerActions" class="hidden flex gap-2">

                     <a href="index.html" class="px-3 py-1.5 bg-red-800 text-white font-bold rounded-lg hover:bg-red-900 transition text-xs sm:text-sm">
                        Home
                    </a>

                    <a href="store-upload.html" class="px-3 py-1.5 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 transition text-xs sm:text-sm flex items-center gap-1">
                        <span>Add</span>
                    </a>
                    <a href="store-profile.html" class="px-3 py-1.5 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-900 transition text-xs sm:text-sm">
                        Profile Setting
                    </a>
                </div>
                
                <button onclick="shareStore()" class="p-2 text-slate-600 hover:text-orange-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 100-2.684 3 3 0 000 2.684zm0 9.316a3 3 0 100-2.684 3 3 0 000 2.684z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Store Header -->
    <div class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:py-10">
            <div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start text-center sm:text-left">
                <div class="w-24 h-24 sm:w-32 sm:h-32 bg-gradient-to-br from-orange-400 to-orange-600 rounded-2xl flex items-center justify-center text-white text-4xl sm:text-5xl font-black shadow-lg flex-shrink-0">
                    <span id="storeLogo">S</span>
                </div>
                <div class="flex-1 w-full">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-2">
                        <div>
                            <h1 id="storeName" class="text-2xl sm:text-4xl font-black text-slate-900">Store Name</h1>
                            <p id="storeCategory" class="text-xs sm:text-sm font-bold text-orange-600 uppercase tracking-widest mt-1">Category</p>
                        </div>
                        <button id="followBtn" onclick="toggleFollowStore()" class="w-full sm:w-auto px-8 py-2.5 bg-orange-600 text-white font-bold rounded-xl hover:bg-orange-700 active:scale-95 transition shadow-md">
                            Follow Store
                        </button>
                    </div>
                    <p id="storeDescription" class="text-slate-600 text-sm sm:text-base mb-6 max-w-3xl leading-relaxed">Store description goes here</p>
                    
                    <div class="flex justify-center sm:justify-start gap-8 border-t border-slate-50 pt-4">
                        <div class="text-center sm:text-left">
                            <p class="text-xl font-black text-slate-900" id="totalProducts">0</p>
                            <p class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase">Products</p>
                            <div class="flex gap-3 mt-2 justify-center sm:justify-start text-[10px] font-bold">
                                <span class="text-blue-600"><span id="storeCount">0</span> Store</span>
                                <span class="text-purple-600"><span id="homepageCount">0</span> Uploaded in Homepage</span>
                            </div>
                        </div>
                        <div class="text-center sm:text-left">
                            <p class="text-xl font-black text-slate-900" id="followers">0</p>
                            <p class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase">Followers</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Products Section -->
    <div class="max-w-7xl mx-auto px-4 py-8 sm:py-12">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-xl sm:text-2xl font-black text-slate-900">All Products</h2>
            <div class="relative">
                <select id="sortBy" onchange="applyFilters()" class="appearance-none pl-4 pr-10 py-2 bg-white border border-slate-200 rounded-xl font-bold text-slate-600 text-xs sm:text-sm focus:ring-2 focus:ring-orange-500 outline-none cursor-pointer">
                    <option value="newest">Newest First</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                </select>
                <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Products Grid -->
        <div id="productsContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-6">
            <!-- Skeleton Loading State -->
            <div class="animate-pulse bg-white rounded-2xl overflow-hidden border border-slate-100">
                <div class="aspect-square bg-slate-100"></div>
                <div class="p-4 space-y-2">
                    <div class="h-4 bg-slate-100 rounded w-3/4"></div>
                    <div class="h-6 bg-slate-100 rounded w-1/2"></div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20 bg-white rounded-3xl border border-dashed border-slate-200">
            <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
            </div>
            <p class="text-slate-500 font-medium">No products found in this store yet.</p>
            <a id="ownerAddFirst" href="store-upload.html" class="hidden mt-6 inline-block px-8 py-3 bg-orange-600 text-white font-black rounded-xl hover:bg-orange-700 transition shadow-lg shadow-orange-200">
                Add Your First Product
            </a>
        </div>
    </div>

    <script src="store-view.js"></script>
    <script>
        function goBack() {
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'index.html';
        }
    </script>
</body>
</html>
