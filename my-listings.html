<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products | Kentai Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script>
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
  <script src="my-listings.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap");
    body { font-family: "Inter", sans-serif; background-color: #f1f1f2; color: #1e293b; }
    .jumia-orange { background-color: #f68b1e; }
    .jumia-text-orange { color: #f68b1e; }
    .table-header { color: #94a3b8; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    @media (min-width: 640px) { .table-header { font-size: 12px; } }
    .active-tab { border-bottom: 3px solid #f68b1e; color: #f68b1e; font-weight: 800; }
    
    /* 24-Color Rainbow Animation for Q&A Notification Circle */
    @keyframes colorChange24 {
      0%   { background-color: #ff0000; box-shadow: 0 0 6px #ff0000; }
      4.17%  { background-color: #ff3d00; box-shadow: 0 0 6px #ff3d00; }
      8.33%  { background-color: #ff7a00; box-shadow: 0 0 6px #ff7a00; }
      12.5%  { background-color: #ffb600; box-shadow: 0 0 6px #ffb600; }
      16.67% { background-color: #ffed00; box-shadow: 0 0 6px #ffed00; }
      20.83% { background-color: #d4ff00; box-shadow: 0 0 6px #d4ff00; }
      25%  { background-color: #99ff00; box-shadow: 0 0 6px #99ff00; }
      29.17% { background-color: #5dff00; box-shadow: 0 0 6px #5dff00; }
      33.33% { background-color: #22ff00; box-shadow: 0 0 6px #22ff00; }
      37.5%  { background-color: #00ff22; box-shadow: 0 0 6px #00ff22; }
      41.67% { background-color: #00ff5d; box-shadow: 0 0 6px #00ff5d; }
      45.83% { background-color: #00ff99; box-shadow: 0 0 6px #00ff99; }
      50%  { background-color: #00ffd4; box-shadow: 0 0 6px #00ffd4; }
      54.17% { background-color: #00d4ff; box-shadow: 0 0 6px #00d4ff; }
      58.33% { background-color: #0099ff; box-shadow: 0 0 6px #0099ff; }
      62.5%  { background-color: #005dff; box-shadow: 0 0 6px #005dff; }
      66.67% { background-color: #0022ff; box-shadow: 0 0 6px #0022ff; }
      70.83% { background-color: #2200ff; box-shadow: 0 0 6px #2200ff; }
      75%  { background-color: #5d00ff; box-shadow: 0 0 6px #5d00ff; }
      79.17% { background-color: #9900ff; box-shadow: 0 0 6px #9900ff; }
      83.33% { background-color: #d400ff; box-shadow: 0 0 6px #d400ff; }
      87.5%  { background-color: #ff00d4; box-shadow: 0 0 6px #ff00d4; }
      91.67% { background-color: #ff0099; box-shadow: 0 0 6px #ff0099; }
      95.83% { background-color: #ff005d; box-shadow: 0 0 6px #ff005d; }
      100% { background-color: #ff0000; box-shadow: 0 0 6px #ff0000; }
    }
    .color-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: colorChange24 6s infinite linear;
      display: inline-block;
      margin-right: 8px;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .color-indicator.has-messages {
      animation: colorChange24 6s infinite linear, pulse 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-4">
        <button onclick="goBack()" class="p-1.5 sm:p-2 hover:bg-slate-100 rounded-lg text-slate-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        </button>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- STORE FEATURE: Add Store Management Button (NEW) -->
         <button onclick="location.href='index.html'" class="bg-red-500 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded font-bold text-[10px] sm:text-sm uppercase tracking-wide hover:bg-red-600 transition whitespace-nowrap">
           Home
        </button>
        <button onclick="location.href='store-profile.html'" class="bg-blue-500 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded font-bold text-[10px] sm:text-sm uppercase tracking-wide hover:bg-blue-600 transition whitespace-nowrap">
           Store
        </button>
        <button onclick="location.href='promote.html'" class="jumia-orange text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded font-bold text-[10px] sm:text-sm uppercase tracking-wide hover:opacity-90 transition whitespace-nowrap">New</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-8">
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
      <!-- Tabs -->
      <div class="flex border-b border-slate-200 px-3 sm:px-6 overflow-x-auto no-scrollbar">
        <button class="px-3 sm:px-4 py-3 sm:py-4 text-xs sm:text-sm active-tab flex items-center gap-2 whitespace-nowrap">
          ACTIVE <span id="activeCount" class="bg-orange-50 text-[8px] sm:text-[10px] px-1 sm:px-1.5 py-0.5 rounded-full jumia-text-orange">0</span>
        </button>
        <div class="flex items-center gap-2 sm:gap-4">
          <button onclick="location.href='questions-replies.html'" class="px-3 sm:px-4 py-3 sm:py-4 text-xs sm:text-sm text-slate-500 hover:text-orange-600 flex items-center gap-1 sm:gap-2 transition font-bold whitespace-nowrap">
            <div id="qaIndicatorContainer" class="items-center">
              <span class="color-indicator"></span>
              <span id="qaNotificationText" class="text-[9px] sm:text-[10px] text-red-600 font-extrabold mr-2 uppercase tracking-tighter hidden">Kindly Check Q&A for MESSAGE update</span>
            </div>
            Q&A <span id="qaMessageCount" class="bg-slate-100 text-[8px] sm:text-[10px] px-1 sm:px-1.5 py-0.5 rounded-full text-slate-500">0</span>
          </button>
          <label class="flex items-center gap-1.5 sm:gap-2 px-2 py-2 cursor-pointer hover:bg-slate-50 rounded transition">
            <input type="checkbox" id="clearQACheckbox" onchange="handleClearQA(this.checked)" class="w-3.5 sm:w-4 h-3.5 sm:h-4 rounded cursor-pointer">
            <span class="text-[10px] sm:text-xs font-bold text-slate-600 uppercase tracking-wider hidden xs:inline">Clear Q&A</span>
          </label>
        </div>
      </div>

      <!-- Table Wrapper for Horizontal Scroll on Mobile -->
      <div class="overflow-x-auto">
        <div class="min-w-full sm:min-w-[800px]">
          <!-- Table Header -->
          <div class="grid grid-cols-12 px-3 sm:px-6 py-3 sm:py-4 bg-white border-b border-slate-100 table-header">
            <div class="col-span-5 sm:col-span-4">Product</div>
            <div class="col-span-2 text-center">Rating</div>
            <div class="col-span-2 text-center hidden sm:block">Date</div>
            <div class="col-span-2 sm:col-span-1 text-center">Price</div>
            <div class="col-span-3 sm:col-span-3 text-right">Actions</div>
          </div>

          <!-- Listings Container -->
          <div id="listingsTable" class="divide-y divide-slate-100">
            <!-- Rows will be injected here -->
          </div>
        </div>
      </div>

      <div id="loadingState" class="flex justify-center py-12 sm:py-20">
        <div class="animate-spin rounded-full h-6 w-6 sm:h-8 sm:w-8 border-4 border-orange-500 border-t-transparent"></div>
      </div>

      <div id="emptyState" class="text-center py-16 sm:py-32 hidden">
        <p class="text-slate-400 font-bold uppercase text-[10px] sm:text-xs tracking-widest">No active products found.</p>
        <button onclick="location.href='promote.html'" class="mt-3 sm:mt-4 jumia-text-orange font-bold text-xs sm:text-sm hover:underline">Create your first product now</button>
      </div>
    </div>
  </main>

  <!-- Delete Modal -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-[100] p-4">
    <div class="bg-white rounded-2xl p-6 sm:p-8 max-w-sm w-full text-center shadow-xl">
      <h3 class="text-lg font-bold text-slate-900 mb-2">Delete Product?</h3>
      <p class="text-slate-500 text-sm mb-6">Are you sure you want to permanently remove this product from the marketplace?</p>
      <div class="flex gap-3">
        <button onclick="cancelDelete()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-bold text-sm">Cancel</button>
        <button onclick="confirmDelete()" class="flex-1 py-2.5 bg-red-500 text-white rounded-xl font-bold text-sm">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // Initialize Q&A state on page load
    function initializeQAState() {
      const badge = document.getElementById('qaMessageCount');
      const indicator = document.getElementById('qaIndicatorContainer');
      const notificationText = document.getElementById('qaNotificationText');
      const colorIndicator = indicator ? indicator.querySelector('.color-indicator') : null;
      const checkbox = document.getElementById('clearQACheckbox');
      
      // Always ensure the indicator container is visible
      if (indicator) {
        indicator.style.display = 'flex';
      }
      if (badge) {
        badge.style.display = 'inline-flex';
      }
      if (checkbox) {
        checkbox.checked = false;
      }
      // notification text and has-messages class will be managed by my-listings.js render()
    }

    // Run on page load
    document.addEventListener('DOMContentLoaded', initializeQAState);
    window.addEventListener('load', initializeQAState);

    function handleClearQA(isChecked) {
      if (!isChecked) return;
      
      const badge = document.getElementById('qaMessageCount');
      const qaCount = badge ? badge.textContent : '0';
      
      if (!confirm(`Are you sure you want to clear ${qaCount} unread messages?`)) {
        document.getElementById('clearQACheckbox').checked = false;
        return;
      }
      
      // Save to localStorage to dismiss notifications
      localStorage.setItem('qaCleared', 'true');
      
      // Update the visual state
      const notificationText = document.getElementById('qaNotificationText');
      if (notificationText) {
        notificationText.classList.add('hidden');
      }
      const colorIndicator = document.getElementById('qaIndicatorContainer')?.querySelector('.color-indicator');
      if (colorIndicator) {
        colorIndicator.classList.remove('has-messages');
      }
      
      // Uncheck the checkbox
      document.getElementById('clearQACheckbox').checked = false;
      
      // Reset the badge to 0
      if (badge) {
        badge.textContent = '0';
        badge.classList.add('bg-slate-100', 'text-slate-500');
        badge.classList.remove('bg-red-500', 'text-white');
      }
      
      console.log('Q&A notifications cleared');
    }
  </script>
</body>
  <script src="chat-widget.js"></script>
</html>
